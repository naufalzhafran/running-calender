# /etc/nginx/sites-available/running-calendar.conf
# Static site from /var/www/running-calendar/current, API in Docker on 127.0.0.1:8080.
# Get the certificate with: sudo certbot --nginx -d running.madebynz.xyz

upstream running_calendar_api {
  server 127.0.0.1:8080;
  keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  server_name running.madebynz.xyz;
  return 301 https://$host$request_uri;
}

server {
  # On nginx >= 1.25.1 you may switch to `listen 443 ssl;` + `http2 on;`.
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name running.madebynz.xyz;

  # ssl_certificate / ssl_certificate_key are added by certbot.

  root /var/www/running-calendar/current;
  index index.html;
  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # REST API (public reads, token-protected /api/admin/*).
  location /api/ {
    client_max_body_size 1m;
    proxy_pass http://running_calendar_api;
  }

  # Optional second layer for writes: only allow your own IP.
  # location /api/admin/ {
  #   allow 203.0.113.10;
  #   deny all;
  #   client_max_body_size 1m;
  #   proxy_pass http://running_calendar_api;
  # }

  # Event and wallpaper pages: Go injects per-event <title>/Open Graph tags
  # into event.html / wallpaper.html so link previews work.
  location ~ ^/(events|wallpaper)/[^/]+$ {
    proxy_pass http://running_calendar_api;
  }

  # HTML, JS and CSS are not fingerprinted, so always revalidate (cheap 304s).
  location ~* \.(?:html|js|css|webmanifest)$ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }

  location ~* \.(?:png|svg|ico)$ {
    expires 7d;
    add_header Cache-Control "public";
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri $uri.html $uri/ =404;
  }
}
