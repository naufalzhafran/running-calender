services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POCKETBASE_URL: ${POCKETBASE_URL:-http://pocketbase:8090}
      POCKETBASE_ADMIN_COLLECTION: ${POCKETBASE_ADMIN_COLLECTION:-admins}
    ports:
      - "5678:3000"
    depends_on:
      - pocketbase

  pocketbase:
    build:
      context: .
      dockerfile: docker/pocketbase/Dockerfile
      args:
        PB_VERSION: 0.37.5
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations
