name: Sync events

on:
  push:
    branches: [main]
    paths:
      - "data/events/**.json"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview changes without writing to PocketBase"
        type: boolean
        default: true

concurrency:
  group: sync-events
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      RUNNING_CALENDAR_URL: ${{ secrets.RUNNING_CALENDAR_URL }}
      POCKETBASE_ADMIN_EMAIL: ${{ secrets.POCKETBASE_ADMIN_EMAIL }}
      POCKETBASE_ADMIN_PASSWORD: ${{ secrets.POCKETBASE_ADMIN_PASSWORD }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$RUNNING_CALENDAR_URL" ] || [ -z "$POCKETBASE_ADMIN_EMAIL" ] || [ -z "$POCKETBASE_ADMIN_PASSWORD" ]; then
            echo "::notice::Set RUNNING_CALENDAR_URL, POCKETBASE_ADMIN_EMAIL and POCKETBASE_ADMIN_PASSWORD secrets to enable event sync."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'

      - name: Import events
        if: steps.secrets.outputs.ready == 'true'
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          shopt -s nullglob
          files=(data/events/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No event files in data/events"
            exit 0
          fi
          flags=()
          if [ "$DRY_RUN" = "true" ]; then
            flags+=(--dry-run)
          fi
          npm run --silent events -- import "${files[@]}" "${flags[@]}"
